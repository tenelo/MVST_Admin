name: mvst_admin
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.11.1


dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0   
  qr_flutter: ^4.1.0
  flutter_spinkit: ^5.2.2
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  image_picker: ^1.2.1
  firebase_storage: ^13.1.0
  intl: ^0.20.2
  ticket_widget: ^1.0.2
  ticket_material: ^0.3.1
  syncfusion_flutter_charts: ^33.1.44
  syncfusion_flutter_datepicker: ^33.1.44
  open_file: ^3.5.11
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  pdf: ^3.12.0
  flutter_speed_dial: ^7.0.0
  shared_preferences: ^2.5.4
  socket_io_client: ^3.1.4
  mobile_scanner: ^7.2.0
  dot_curved_bottom_nav: ^0.0.2
  flutter_secure_storage: ^10.2.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.1





#flutter pub run flutter_native_splash:create
flutter_native_splash:
  image: "assets/splashB.png"
  color: "#1A2B3C"




#flutter pub run flutter_launcher_icons:main
#flutter_icons:
flutter_launcher_icons:
  remove_alpha_ios: true
  android: true
  image_path: "icons/admin.png"





  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/



  fonts:
    - family: Lobster
      fonts:
        - asset: fonts/Lobster-Regular.ttf